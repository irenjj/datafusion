[package]
name = "datafusion-vllm-poc"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
datafusion = { version = "=54.1.0", default-features = false, features = ["sql", "string_expressions"] }
futures = "0.3"
serde = "1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0

# Keep the 54.1.0 prototype independent of the repository workspace.
[workspace]
