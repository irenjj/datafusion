name: LLM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-check:
    name: LLM (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default + Parquet
            flavor: default
            args: --features llm
          - features: minimal
            flavor: minimal
            args: --no-default-features --features sql,string_expressions,llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rustup
      - name: Check formatting
        if: matrix.flavor == 'default'
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: llm-${{ matrix.flavor }}
      - name: Clippy
        if: matrix.flavor == 'default'
        run: cargo clippy --locked -p datafusion --features llm --all-targets -- -D warnings
      - name: Run projection optimizer unit tests
        if: matrix.flavor == 'default'
        run: cargo test --locked -p datafusion-optimizer --lib optimize_projections
      - name: Run LLM unit tests
        if: matrix.flavor == 'default'
        run: |
          cargo test --locked -p datafusion-ai --lib llm::
      - name: Run LLM contracts and differential fuzz smoke
        run: cargo test --locked -p datafusion ${{ matrix.args }} --test llm
