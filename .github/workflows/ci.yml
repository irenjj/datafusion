name: AI verification

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch or commit to diff changed crates against'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rustup
      - name: Check formatting
        run: scripts/evidence.sh --name fmt --output-dir evidence/ -- cargo fmt --all -- --check
      - name: Upload formatting evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fmt-${{ github.run_attempt }}
          path: evidence/

  crate-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rustup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest@0.9.137
      - name: Verify changed crates
        env:
          BASE_REF: ${{ inputs.base_ref || 'main' }}
        run: |
          base_ref=${BASE_REF#refs/heads/}
          remote_ref="refs/remotes/origin/$base_ref"
          if git show-ref --verify --quiet "$remote_ref"; then
            base_commit=$remote_ref
          elif [[ $base_ref =~ ^[[:xdigit:]]{4,40}$ ]] &&
               base_commit=$(git rev-parse --verify --quiet "$base_ref^{commit}"); then
            :
          else
            git check-ref-format "refs/heads/$base_ref"
            git fetch --no-tags origin -- "$BASE_REF"
            base_commit=FETCH_HEAD
          fi
          base_sha=$(git merge-base "$base_commit" HEAD)
          ./ci/scripts/check_large_files.sh --base "$base_sha" --head HEAD
          changed=$(git diff --name-only --no-renames "$base_sha" HEAD -- datafusion/core/ datafusion/lake/ datafusion/dist/)
          if [[ -n "$changed" ]]; then
            git submodule update --init --depth 1
          fi
          scripts/verify-changed-crates.sh "$base_sha" evidence/
      - name: Upload crate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-crates-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: ignore

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the generator and record evidence
        run: scripts/evidence.sh --name repo-infra --output-dir evidence/ -- scripts/test-evidence.sh
      - name: Upload generator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence-${{ github.run_attempt }}
          path: evidence/
