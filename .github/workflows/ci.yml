name: AI verification

on:
  pull_request:
    paths:
      - 'datafusion/ai/**'
      - 'datafusion/lake/**'
      - 'datafusion/dist/**'
      - 'datafusion/core/**'
      - 'scripts/**'
      - 'docs/TEST_INDEX.md'
      - 'docs/VERIFICATION.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-rustup/**'
      - '.github/actions/setup-rust-runtime/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rustup
      - name: Check formatting
        run: scripts/evidence.sh --name fmt --output-dir evidence/ -- cargo fmt --all -- --check
      - name: Upload formatting evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fmt-${{ github.run_attempt }}
          path: evidence/

  crate-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-rustup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest@0.9.137
      - name: Prepare shared test fixtures
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- datafusion/core/ datafusion/lake/ datafusion/dist/)
          if [[ -n "$changed" ]]; then
            git submodule update --init --depth 1
          fi
      - name: Clippy and nextest for changed crates
        run: scripts/verify-changed-crates.sh HEAD^1 evidence/
      - name: Upload crate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-crates-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: ignore

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the generator and record evidence
        run: scripts/evidence.sh --name repo-infra --output-dir evidence/ -- scripts/test-evidence.sh
      - name: Upload generator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence-${{ github.run_attempt }}
          path: evidence/
