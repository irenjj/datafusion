[package]
name = "datafusion-dist"
description = "Local map-only split execution of DataFusion plans"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
publish = false

[lints]
workspace = true

[features]
parquet_encryption = ["datafusion/parquet_encryption"]

[dependencies]
datafusion = { workspace = true, features = ["parquet"] }
datafusion-proto = { workspace = true, features = ["parquet"] }
futures = { workspace = true }
hex = { workspace = true }
prost = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
rand = { workspace = true }
tempfile = { workspace = true }
test-utils = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
