CONSTANTS
    SplitIds = {1, 2}
    Workers = {1, 2}
    MaxAttempts = 2
    LeaseTTL = 2
    MaxAttemptDuration = 3
    MaxTime = 6
    Values = {1, 2}

SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE

INVARIANTS
    TypeOK
    SingleActiveLeasePerSplit
    AtMostOneCommitPerSplit
    HardDeadlineNeverExceeded
    AttemptBudgetRespected
    FencingMonotonicAndNoStaleCommit
    CommitReplayOutcomes

PROPERTIES
