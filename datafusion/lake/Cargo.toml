[package]
name = "datafusion-lake"
description = "Internal read-only lake table scans for DataFusion"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
datafusion-ai = { workspace = true }
datafusion-catalog = { workspace = true }
datafusion-common = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-plan = { workspace = true }
# Match the SQL support enabled by the Lance function registry.
datafusion-sql = { workspace = true, features = ["unicode_expressions"] }
futures = { workspace = true }
hex = { workspace = true }
lance = { workspace = true }
lance-core = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false }
lance-index = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false }
lance-io = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false }
lance-table-runtime = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false }
object_store = { workspace = true }
paimon = { workspace = true }
paimon-vindex-core = "=0.6.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
datafusion-optimizer = { workspace = true }
lance-file = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false }
lance-linalg = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false }
lance-table = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false }
lance-testing = { git = "https://github.com/irenjj/lance.git", rev = "d7774c85fd5416ea5e10f1b5fe861bda7a603672", default-features = false, features = ["datafusion"] }
prost = { workspace = true }
prost-types = "0.14"
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
