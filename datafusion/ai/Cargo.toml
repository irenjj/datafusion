[package]
name = "datafusion-ai"
description = "Internal DataFusion AI contracts and runtime"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[features]
default = ["runtime"]
runtime = [
    "dep:datafusion-execution",
    "dep:datafusion-expr",
    "dep:datafusion-optimizer",
    "dep:datafusion-physical-expr",
    "dep:datafusion-physical-plan",
    "dep:datafusion-session",
    "dep:futures",
    "dep:log",
    "dep:parking_lot",
    "dep:tokio",
    "dep:tokio-util",
]

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
datafusion-common = { workspace = true }
datafusion-execution = { workspace = true, optional = true }
datafusion-expr = { workspace = true, optional = true }
datafusion-optimizer = { workspace = true, optional = true }
datafusion-physical-expr = { workspace = true, optional = true }
datafusion-physical-plan = { workspace = true, optional = true }
datafusion-session = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
log = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "runtime"
path = "tests/runtime.rs"
required-features = ["runtime"]
